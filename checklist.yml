description: Configuration file for checklist::check_pkg()
package: yes
allowed:
  warnings: []
  notes: []
required:
- CITATION
- DESCRIPTION
- R CMD check
- checklist
- codemeta
- documentation
- filename conventions
- folder conventions
- license
- lintr
- repository secret
- spelling
spelling:
  default: nl-BE
  ignore: LICENSE.md
  other:
    en-GB:
    - .github/CODE_OF_CONDUCT.md
    - .github/CONTRIBUTING.md
    - README.md
    - vignettes/Routines.R
